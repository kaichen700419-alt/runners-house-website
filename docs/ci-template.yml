# 此檔案為 CI workflow 模板，待 GitHub OAuth token 取得 workflow scope 後
# 移動到 .github/workflows/ci.yml 即可啟用。
# 啟用步驟：
#   1. gh auth refresh -h github.com -s workflow
#   2. mv docs/ci-template.yml .github/workflows/ci.yml
#   3. git add -A && git commit -m "ci: 啟用 GitHub Actions CI" && git push

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: 型別檢查與建置
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  unit-test:
    name: 單元測試（Vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-test:
    name: E2E 與無障礙測試（Playwright + axe-core）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # playwright.config.ts 的 webServer 會自動 build + preview
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse 效能稽核
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        # 複用 typecheck-build job 的 dist artifact，避免重複 build 浪費 CI 時間
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        # lighthouserc.json 設定的目標：Performance ≥ 90、Accessibility = 100、Best Practices ≥ 90、SEO = 100
        # numberOfRuns: 3 取中位數降低 flaky；staticDistDir 直接用 dist 不需 preview server
        run: npm run test:perf
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
